# Builds the Android app on every PR to (and push of) the android branch:
# unit-tests the Rust core, cross-compiles it for all four ABIs, and assembles a
# debug APK, so a change that doesn't compile can't be merged unnoticed.
name: Android build

on:
  pull_request:
    branches: [android]
  push:
    branches: [android]

permissions:
  contents: read

# Every action is pinned to a commit, not a tag a repository can move; the comment
# names the release that commit is.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust core unit tests
        working-directory: rust
        run: cargo test --locked

      # The desktop vaults branch's end-to-end script, run against the same vault
      # code through a host-side CLI (examples/vault_cli.rs, not shipped).
      - name: Vault round trip
        working-directory: rust
        run: |
          cargo build --release --locked --example vault_cli --features cli
          bash tests/vault_roundtrip.sh

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      # Caches Gradle and validates the committed wrapper jar against Gradle's
      # published checksums; the wrapper pins the Gradle version and its hash.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # cargo-ndk finds the NDK through ANDROID_NDK_ROOT, which the runner sets.
      - name: Assemble debug APK (runs build-rust.sh via preBuild)
        run: ./gradlew assembleDebug --stacktrace

      # VaultHelpersTest: the desktop's test_frontend_helpers.py, ported.
      - name: Kotlin unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vaultsend-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
